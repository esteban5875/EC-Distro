name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Build
        run: python3 ecdistro.py build

      - name: Boot test
        run: python3 ecdistro.py test --timeout 300

      - name: Checksums
        working-directory: out
        run: sha256sum ec-distro-*.iso bzImage initramfs.cpio.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ec-distro
          path: |
            out/ec-distro-*.iso
            out/bzImage
            out/initramfs.cpio.gz
            out/SHA256SUMS
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ec-distro
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EC-Distro ${GITHUB_REF_NAME#v}" \
            --generate-notes
