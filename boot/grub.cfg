# GRUB menu for the EC-Distro ISO. Output goes to the serial port so it
# shows up with `qemu -nographic`, and to the screen when there is one.
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

set timeout=3
set default=0

menuentry "EC-Distro" {
    linux /boot/bzImage console=ttyS0 rdinit=/init quiet loglevel=3
    initrd /boot/initramfs.cpio.gz
}
